image: alpine/3.24
packages:
  - age
  - cargo
  - git
  - git-daemon # Provides git http-backend for the HTTPS integration test.
  - just
  - openssh-client
  - openssl
  - python3
secrets:
  - b566bd73-a773-48ca-be59-7b88577d83eb
sources:
  - https://git.sr.ht/~mapperr/sec#master
submitter:
  git.sr.ht:
    enabled: false
tasks:
  - test: |
      cd sec && just test test-integration
  - mirror: |
      set -eu
      cd sec
      revision=$(git rev-parse --verify HEAD)
      upstream=$(git ls-remote --exit-code origin refs/heads/master)
      if [ "$revision" != "${upstream%%[[:space:]]*}" ]; then
          printf '%s\n' 'SourceHut master moved after checkout. Mirror skipped.'
          exit 0
      fi
      if [ ! -s "$HOME/.ssh/known_hosts" ]; then
          printf '%s\n' 'Configure the verified GitHub host key in ~/.ssh/known_hosts.' >&2
          exit 1
      fi
      GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=yes' \
        git push --no-follow-tags --recurse-submodules=no \
          git@github.com:mapperr/sec.git "$revision:refs/heads/master"

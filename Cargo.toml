[package]
name = "sec"
version = "0.9.0"
edition = "2024"
rust-version = "1.91"
description = "Manage age-encrypted secrets in files, Git, stores and commands"
license-file = "LICENSE"
repository = "https://git.sr.ht/~mapperr/sec"
publish = false

[dependencies]
age = { version = "0.12.1", features = ["armor", "plugin"] }
anyhow = "1"
base64 = "0.22"
data-encoding = "2"
globset = "0.4"
hmac = "0.12"
indexmap = "2"
regex = "1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
wait-timeout = "0.2"
which = "8"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
getrandom = "0.3"
libc = "0.2"
rustix = { version = "1", features = ["fs", "process", "termios"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

